version: 2

models:
  - name: dim_household
    description: "Household dimension with one row per household."

    columns:
      - name: household_key
        description: "Surrogate key for the household dimension."
        tests:
          - not_null
          - unique

      - name: lclid
        description: "Business key from the source household dataset."
        tests:
          - not_null
          - unique

  - name: dim_date
    description: "Date dimension with one row per calendar date."

    columns:
      - name: date_key
        description: "Smart integer date key in YYYYMMDD format."
        tests:
          - not_null
          - unique

      - name: full_date
        description: "Calendar date."
        tests:
          - not_null
          - unique

  - name: fact_energy_daily
    description: "Daily household energy fact table. Grain is one household per day."

    columns:
      - name: household_key
        description: "Foreign key to dim_household."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_household')
                field: household_key

      - name: date_key
        description: "Foreign key to dim_date."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_weather_daily
    description: "Daily weather fact table. Grain is one weather record per day."

    columns:
      - name: date_key
        description: "Foreign key to dim_date."
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key